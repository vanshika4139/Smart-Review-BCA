<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart-Review | Products Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-slate-50 text-slate-800 font-sans">

    <nav class="bg-slate-900 text-white p-4 shadow-md">
        <div class="max-w-6xl mx-auto flex justify-between items-center">
            <h1 class="text-xl font-bold tracking-wider text-sky-400">Smart-Review AI</h1>
            <span class="bg-sky-500/20 text-sky-300 px-3 py-1 rounded text-xs border border-sky-500/30">BCA Project Hub</span>
        </div>
    </nav>

    <main class="max-w-6xl mx-auto px-4 py-10">
        <h2 class="text-2xl font-extrabold mb-2 text-slate-900">Select a Product to Review</h2>
        <p class="text-slate-500 mb-8">AI-Powered Real-Time Sentiment Evaluation Hub</p>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
            {% for product in products %}
            <div class="bg-white border border-slate-200 rounded-xl overflow-hidden shadow-sm hover:shadow-md transition-all flex flex-col justify-between">
                <div>
                    <img src="{{ product.image_url }}" alt="{{ product.name }}" class="w-full h-48 object-cover">
                    <div class="p-5">
                        <span class="text-xs font-semibold text-sky-600 uppercase tracking-wider">{{ product.category }}</span>
                        <h3 class="text-lg font-bold text-slate-900 mt-1 mb-2">{{ product.name }}</h3>
                        <p class="text-sm text-slate-600 line-clamp-3">{{ product.description }}</p>
                    </div>
                </div>
                <div class="p-5 pt-0">
                    <a href="/product/{{ product.id }}" class="block w-full text-center bg-slate-900 hover:bg-sky-600 text-white font-medium py-2 px-4 rounded-lg transition-colors text-sm">
                        Analyze & Write Review
                    </a>
                </div>
            </div>
            {% endfor %}
        </div>
    </main>

</body>
</html>
